# Shared proxy settings for Open WebUI locations (included from irontools-hub)
auth_request /__hub_auth;
auth_request_set $hub_user $upstream_http_x_hub_user;
auth_request_set $hub_name $upstream_http_x_hub_name;

proxy_pass http://open_webui;
proxy_http_version 1.1;
proxy_set_header Host              $host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host  $host;
proxy_set_header Upgrade           $http_upgrade;
proxy_set_header Connection        $connection_upgrade;

# Hub identity → Open WebUI trusted-header SSO
proxy_set_header X-Webauth-User $hub_user;
proxy_set_header X-Webauth-Name $hub_name;
proxy_set_header X-Webauth-Role admin;

# Keep OWUI session cookie (token); Hub gate is auth_request only
proxy_set_header Cookie $http_cookie;

proxy_read_timeout 3600s;
proxy_send_timeout 3600s;
proxy_buffering off;
proxy_request_buffering off;
