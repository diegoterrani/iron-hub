# Iron Open WebUI → OpenRouter (OpenAI-compatible)
# Escuta só em 127.0.0.1:3080 — acesso público via Hub/nginx :443 (/t/open-webui/)
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "127.0.0.1:3080:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Backend LLM via OpenRouter (OpenAI-compatible)
      ENABLE_OPENAI_API: "True"
      OPENAI_API_BASE_URL: ${OPENAI_API_BASE_URL:-https://openrouter.ai/api/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Sem Ollama / llama.cpp local neste host
      ENABLE_OLLAMA_API: "False"
      ENABLE_DIRECT_CONNECTIONS: "False"
      OLLAMA_BASE_URL: ""
      DEFAULT_MODELS: ${DEFAULT_MODELS:-deepseek/deepseek-chat-v3.1}
      # Public gate = Iron Hub session (nginx auth_request).
      # OWUI SSO via trusted headers injected by nginx from Hub /me.
      WEBUI_AUTH: "True"
      ENABLE_VERSION_UPDATE_CHECK: "False"
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      WEBUI_AUTH_TRUSTED_EMAIL_HEADER: X-Webauth-User
      WEBUI_AUTH_TRUSTED_NAME_HEADER: X-Webauth-Name
      WEBUI_AUTH_TRUSTED_ROLE_HEADER: X-Webauth-Role
      ENABLE_SIGNUP: "True"
      ENABLE_LOGIN_FORM: "False"
      ENABLE_PASSWORD_AUTH: "True"
      DEFAULT_USER_ROLE: admin
      WEBUI_NAME: Iron Open WebUI
      WEBUI_URL: https://irontools.iron-security.com/

      FORWARDED_ALLOW_IPS: "*"
      # Evitar jobs paralelos pesados no lab
      ENABLE_TITLE_GENERATION: "False"
      ENABLE_TAGS_GENERATION: "False"
      ENABLE_FOLLOW_UP_GENERATION: "False"
      ENABLE_SEARCH_QUERY_GENERATION: "False"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "False"
      ENABLE_AUTOCOMPLETE_GENERATION: "False"
      # Iron Lab Host tool (Workspace) → host agent :8793
      ENABLE_TOOLS: "True"
      ENABLE_CODE_INTERPRETER: "False"
      # Allow OWUI container to reach iron-lab-agent on the host
      IRON_LAB_AGENT_URL: http://172.19.0.1:8793
      ENABLE_IMAGE_GENERATION: "False"
      ENABLE_WEB_SEARCH: "False"
      ENABLE_RAG_WEB_SEARCH: "False"
      ENABLE_RAG_LOCAL_WEB_FETCH: "False"
      RAG_EMBEDDING_ENGINE: ""
      CHUNK_SIZE: "500"
      RAG_TOP_K: "0"
    volumes:
      - open_webui_data:/app/backend/data
      # Served from STATIC_DIR (= backend/open_webui/static), not /app/build/static.
      # Clears stale ui.models before onMount so Hub SSO can populate the picker.
      - ./static/loader.js:/app/backend/open_webui/static/loader.js:ro
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

volumes:
  open_webui_data:
