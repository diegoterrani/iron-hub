# irontools.iron-security.com
#
# Hub (apex sem cookie): / → /console/
# Open WebUI (cookie):   / → proxy :3080 (home real da SPA; /c sozinho dá 404 no OWUI 0.10)
# Graphify MCP:          /mcp/graphify → /t/graphify/mcp (Hub injeta API key)
# Entrada WebUI:         /go/open-webui (auth Hub → set cookie → /)
# Voltar ao Hub:         /go/hub (limpa cookie) ou /console/
# /console/ NÃO limpa o cookie — Hub e WebUI podem ficar em abas paralelas.
#
# Auth: nginx auth_request (Hub) + trusted-header SSO no Open WebUI
#
# IMPORTANT: never use `return` in the same location as `auth_request`
# (rewrite phase runs before access phase and skips auth). Prefer
# try_files → named location, or proxy_pass after auth_request.

# $connection_upgrade — /etc/nginx/conf.d/websocket-map.conf

map $cookie_iron_app $iron_owui {
    default 0;
    open-webui 1;
}

# Only /error is a hard escape to Hub. redirect=/ is valid OWUI home under cookie mode.
map $arg_redirect $iron_auth_escape {
    default 0;
    "/error" 1;
}

# After rewrite, $uri is /api/... — never let browsers disk-cache API as HTML
map $uri $owui_api_cache_control {
    default "";
    ~^/(api|openai|ollama)(/|$) "no-store, no-cache, must-revalidate, max-age=0";
}

upstream iron_hub {
    server 127.0.0.1:3900;
    keepalive 32;
}

upstream open_webui {
    server 127.0.0.1:3080;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name irontools.iron-security.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name irontools.iron-security.com;

    ssl_certificate     /etc/letsencrypt/live/irontools.iron-security.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/irontools.iron-security.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location = /__hub_auth {
        internal;
        proxy_pass http://127.0.0.1:3900/hub/api/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host 127.0.0.1:3900;
    }

    error_page 401 = @hub_login;

    location @hub_login {
        return 302 /console/;
    }

    # Shared OWUI proxy (auth + trusted headers). Used by named locations only.
    # IMPORTANT: named location + proxy_pass (no URI) preserves trailing slashes
    # ($uri normalization would turn /api/v1/auths/ into /api/v1/auths → SPA HTML).
    location @open_webui_proxy {
        error_page 401 = @hub_login;
        auth_request /__hub_auth;
        auth_request_set $hub_user $upstream_http_x_hub_user;
        auth_request_set $hub_name $upstream_http_x_hub_name;

        proxy_pass http://open_webui;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header X-Webauth-User    $hub_user;
        proxy_set_header X-Webauth-Name    $hub_name;
        proxy_set_header X-Webauth-Role    admin;
        proxy_set_header Cookie            $http_cookie;
        proxy_cookie_flags ~ secure;
        add_header Cache-Control $owui_api_cache_control always;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Iron patch: always revalidate Hub SSO model bootstrap script
    location = /static/loader.js {
        if ($iron_owui = 0) { return 302 /console/; }
        auth_request /__hub_auth;
        auth_request_set $hub_user $upstream_http_x_hub_user;
        auth_request_set $hub_name $upstream_http_x_hub_name;
        proxy_pass http://open_webui;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Webauth-User $hub_user;
        proxy_set_header X-Webauth-Name $hub_name;
        proxy_set_header X-Webauth-Role admin;
        proxy_set_header Cookie $http_cookie;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        expires -1;
    }

    # Card do Hub → autentica, seta cookie, redireciona à WebUI via nginx :443
    location = /go/open-webui {
        auth_request /__hub_auth;
        error_page 401 = @hub_login;
        # try_files runs AFTER auth_request (unlike `return`)
        try_files /nonexistent @owui_cookie_redirect;
    }

    location @owui_cookie_redirect {
        add_header Set-Cookie "iron_app=open-webui; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=43200" always;
        add_header Clear-Site-Data "\"cache\"" always;
        # OWUI 0.10 home is "/". Bare "/c" is not a route (only /c/{chatId}) → SPA 404.
        # With iron_app cookie, location = / proxies to Open WebUI.
        return 302 /;
    }

    location = /go/hub {
        add_header Set-Cookie "iron_app=; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0" always;
        return 302 /console/;
    }

    location = /console {
        return 302 /console/;
    }

    # Hub permanente — não limpa iron_app (WebUI pode estar em outra aba).
    # Para sair do modo WebUI na raiz (/), use /go/hub.
    location ^~ /console/ {
        proxy_pass http://iron_hub/console/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ^~ /hub/ {
        proxy_pass http://iron_hub;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /t/open-webui { return 302 /go/open-webui; }
    location ^~ /t/open-webui/ { return 302 /go/open-webui; }

    # Graphify MCP Streamable HTTP — short alias → Hub gateway (/t/graphify/mcp)
    # Auth: Hub session cookie. Upstream API key is injected by iron-hub.
    location = /mcp/graphify {
        rewrite ^ /t/graphify/mcp break;
        proxy_pass http://iron_hub;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Cookie            $http_cookie;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
    location ^~ /mcp/graphify/ {
        rewrite ^/mcp/graphify/?(.*)$ /t/graphify/mcp/$1 break;
        proxy_pass http://iron_hub;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Cookie            $http_cookie;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location ^~ /t/ {
        proxy_pass http://iron_hub;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location = /api/health {
        auth_request /__hub_auth;
        error_page 401 = @hub_login;
        proxy_pass http://iron_hub;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    location = /api/services {
        auth_request /__hub_auth;
        error_page 401 = @hub_login;
        proxy_pass http://iron_hub;
        proxy_set_header Host $host;
        proxy_set_header Cookie $http_cookie;
    }

    # OWUI: ONLY /api/models/ (and openai/ollama twins) return SPA HTML with a
    # trailing slash. Do NOT strip slash for /api/v1/auths/ — that endpoint
    # REQUIRES the trailing slash (without it OWUI serves index.html and SSO dies).
    location ~ ^/(api|openai|ollama)/models/$ {
        if ($iron_owui = 0) { return 302 /console/; }
        auth_request /__hub_auth;
        auth_request_set $hub_user $upstream_http_x_hub_user;
        auth_request_set $hub_name $upstream_http_x_hub_name;
        rewrite ^/(api|openai|ollama)/models/$ /$1/models break;
        proxy_pass http://open_webui;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Webauth-User    $hub_user;
        proxy_set_header X-Webauth-Name    $hub_name;
        proxy_set_header X-Webauth-Role    admin;
        proxy_set_header Cookie            $http_cookie;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    # Stuck OWUI auth tab (redirect=/ or /error) → leave WebUI mode, open Hub.
    location = /auth {
        if ($iron_auth_escape = 1) {
            return 302 /go/hub;
        }
        if ($iron_owui = 0) { return 302 /console/; }
        auth_request /__hub_auth;
        error_page 401 = @hub_login;
        try_files /nonexistent @open_webui_proxy;
    }

    location = /error {
        return 302 /go/hub;
    }

    # Legacy land path /c (no chat id) → OWUI home. Avoid SPA "404: Not Found".
    location = /c {
        error_page 418 = @owui_home_redirect;
        if ($iron_owui = 1) { return 418; }
        return 302 /console/;
    }

    location @owui_home_redirect {
        return 302 /;
    }

    # Apex: cookie mode → Open WebUI home; otherwise Iron Hub console.
    location = / {
        error_page 418 = @open_webui_proxy;
        error_page 419 = @apex_to_hub;
        if ($iron_owui = 1) {
            return 418;
        }
        return 419;
    }

    location @apex_to_hub {
        add_header Set-Cookie "iron_app=; Path=/; Secure; HttpOnly; SameSite=Lax; Max-Age=0" always;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        return 302 /console/;
    }

    location / {
        # Cookie mode → named location (preserves trailing slash; do NOT rewrite via $uri)
        error_page 418 = @open_webui_proxy;
        if ($iron_owui = 1) {
            return 418;
        }

        proxy_pass http://iron_hub;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
