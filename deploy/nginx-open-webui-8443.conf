map $http_upgrade $connection_upgrade_owui {
    default upgrade;
    ''      close;
}

map $uri $owui8443_cache_control {
    default "";
    ~^/(api|openai|ollama)(/|$) "no-store, no-cache, must-revalidate, max-age=0";
}

server {
    listen 8443 ssl;
    http2 on;
    listen [::]:8443 ssl;
    server_name irontools.iron-security.com;

    ssl_certificate     /etc/letsencrypt/live/irontools.iron-security.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/irontools.iron-security.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    location = /__hub_auth {
        internal;
        proxy_pass http://127.0.0.1:3900/hub/api/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host 127.0.0.1:3900;
        proxy_set_header X-Forwarded-Proto https;
    }

    error_page 401 = @hub_login;

    location @hub_login {
        return 302 https://irontools.iron-security.com/console/?next=https%3A%2F%2Firontools.iron-security.com%3A8443%2F;
    }

    # OWUI SPA returns index.html for /api/models/ — normalize before proxy
    location ~ ^/(api|openai|ollama)/(.+)/$ {
        auth_request /__hub_auth;
        auth_request_set $hub_user $upstream_http_x_hub_user;
        auth_request_set $hub_name $upstream_http_x_hub_name;
        rewrite ^/(api|openai|ollama)/(.+)/$ /$1/$2 break;
        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Webauth-User    $hub_user;
        proxy_set_header X-Webauth-Name    $hub_name;
        proxy_set_header X-Webauth-Role    admin;
        proxy_set_header Cookie            $http_cookie;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location / {
        auth_request /__hub_auth;
        auth_request_set $hub_user $upstream_http_x_hub_user;
        auth_request_set $hub_name $upstream_http_x_hub_name;

        proxy_pass http://127.0.0.1:3080;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade_owui;

        # Hub identity → Open WebUI trusted-header SSO
        proxy_set_header X-Webauth-User $hub_user;
        proxy_set_header X-Webauth-Name $hub_name;
        proxy_set_header X-Webauth-Role admin;
        proxy_set_header Cookie $http_cookie;

        add_header Cache-Control $owui8443_cache_control always;

        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
