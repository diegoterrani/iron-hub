# Open WebUI on HTTPS :443 at root (subdomain).
# DNS required: llm.irontools.iron-security.com → same A as irontools
# Auth: Iron Hub session cookie via auth_request

upstream iron_open_webui {
    server 127.0.0.1:3080;
    keepalive 16;
}

map $http_upgrade $connection_upgrade_llm {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name llm.irontools.iron-security.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        allow all;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    listen [::]:443 ssl;
    server_name llm.irontools.iron-security.com;

    # Cert issued by certbot for this vhost (see deploy notes).
    ssl_certificate     /etc/letsencrypt/live/llm.irontools.iron-security.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/llm.irontools.iron-security.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 64m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;

    location = /__hub_auth {
        internal;
        proxy_pass http://127.0.0.1:3900/hub/api/me;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
        proxy_set_header Host 127.0.0.1:3900;
    }

    error_page 401 = @hub_login;

    location @hub_login {
        return 302 https://irontools.iron-security.com/?next=https%3A%2F%2Fllm.irontools.iron-security.com%2F;
    }

    location / {
        auth_request /__hub_auth;
        proxy_pass http://iron_open_webui;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade_llm;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
