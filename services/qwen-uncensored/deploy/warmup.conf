[Unit]
Wants=qwen-warmup.service
Before=open-webui.service

[Service]
# Do not block service start on warmup (avoids deadlock: warmup Requires this unit).
# --no-block returns immediately; warmup runs After= this unit once it is active.
ExecStartPost=+/usr/bin/systemctl start --no-block qwen-warmup.service
# Give model load + post room on cold boot after NVMe restore
TimeoutStartSec=300
